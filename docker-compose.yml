services:
  vps-panel:
    build: .
    image: vps-panel:secure
    container_name: vps-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
      BASE_PATH: /app/panel_data
      RUN_BOT: "0"
      SESSION_COOKIE_SECURE: "1"
    volumes:
      - panel_data:/app/panel_data
    networks:
      - panel_network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
volumes:
  panel_data:
    driver: local
networks:
  panel_network:
    driver: bridge
